# ============================================================
# PORTFOLIO CONFIGURATION
# This file is in the YAML format and is very sensitive to 
# spaces. Ensure to match the indentation level and spacing
# of new items with existing ones

# ============================================================

site_name: "Fiononana RASAMIMANANA - Geospatial Portfolio"
site_description: "Portfolio of Fiononana RASAMIMANANA — GIS, Remote Sensing, and Spatial Data Science"
site_author: "Fiononana RASAMIMANANA"
# After your site is live, uncomment and set this to your actual GitHub Pages URL:
site_url: "https://fy0500.github.io"

theme:
  name: material
  # Logo (header) and favicon: small contour-map pin, see docs/assets/images/
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  palette:
    # Colours are defined by hand in docs/assets/css/extra.css
    # (variables --paper, --ink, --teal, --accent ...). "custom" tells Material
    # not to impose one of its built-in colours.
    - scheme: default            # Light mode
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate              # Dark mode
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs            # Top-level nav items shown as horizontal tabs
    - navigation.top             # Back-to-top button when scrolling up
    - content.code.copy          # Copy button on all code blocks
  # Fonts are loaded in extra_css below (Fraunces, Instrument Sans, JetBrains Mono, Caveat)
  font: false

extra_css:
  - https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500&display=swap
  - assets/vendor/leaflet/leaflet.css
  - assets/css/extra.css

extra_javascript:
  - assets/vendor/leaflet/leaflet.js
  - assets/js/app.js

markdown_extensions:
  - md_in_html        # Allows Markdown inside HTML blocks (used for project cards)
  - attr_list         # Allows adding CSS classes to elements: ![img](url){ .class }
  - admonition        # Note/warning/tip boxes
  - pymdownx.details  # Collapsible admonition blocks
  - pymdownx.superfences
  - tables
  - pymdownx.emoji:   # Renders :material-icon: and :fontawesome-brands-icon: inline icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: "&copy; Fiononana Rasamimanana &nbsp;·&nbsp; <span class=\"coords\">33.9249° S, 18.4241° E</span>"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fy0500
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/fiononana-rasamimanana
    - icon: material/email
      link: "mailto:rasamimanana.finona@gmail.com"


plugins:
  - search
  - meta
  - mkdocs-jupyter

nav:
  - Home: index.md
  - Projects:
    - "All Projects": projects/index.md
    - "Garden Detection & Road Traffic": projects/sample-project.md
    - "Ecosystem Accounting, Ankarafantsika": projects/ecosystem-accounting-ankarafantsika.md
    - "Car Jaune Bus Tracking (PostGIS)": projects/PostGIS_en.ipynb
    # HOW TO ADD A NEW PROJECT:
    # 1. Copy docs/projects/sample-project.md to docs/projects/your-project-name.md
    #    (or drop an .ipynb file into docs/projects/ for a Jupyter notebook project)
    # 2. Edit the new file with your project content
    # 3. Add a line above (same format): - "Your Project Title": projects/your-project-name.md
    # 4. Add a <article class="proj"> card in docs/projects/index.md
    #    and, if it has a place, a site in docs/assets/js/app.js (SITES) for the home map
  - Publications: publications.md
  - Experience: experience.md
  - Contact: contact.md
